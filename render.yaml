services:
  # ============================================================================
  # 1. NAVIFY FastAPI Backend API (Secure Docker Container)
  # ============================================================================
  - type: web
    name: navify-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/status
    envVars:
      - key: PORT
        value: 8000
      - key: DB_NAME
        value: navify_ecosystem
      - key: MONGO_URL
        sync: false # Set securely in Render dashboard (e.g. from MongoDB Atlas)
      - key: JWT_SECRET
        generateValue: true # Generates a secure cryptographic 256-bit secret
      - key: CORS_ORIGINS
        value: "*" # Or your specific production frontend URL

  # ============================================================================
  # 2. NAVIFY Mobile Web App (Static Edge CDN with Global HTTPS)
  # ============================================================================
  - type: static
    name: navify-mobile
    plan: free
    region: oregon
    buildCommand: cd mobile && npm install && npm run build
    publishPath: ./mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

